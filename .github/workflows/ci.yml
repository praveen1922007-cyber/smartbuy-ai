name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run backend integration tests
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/smartbuy-test
        run: npm run test:integration

  frontend-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run unit tests (Vitest)
        working-directory: frontend
        run: npm test --silent
      - name: Build frontend
        working-directory: frontend
        run: npm run build --silent
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Build and start backend (stable Node process)
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/smartbuy-test
          PORT: 4000
        run: nohup npm run start:ci &
      - name: Start preview server
        working-directory: frontend
        run: nohup npx vite preview --port 5173 &
      - name: Wait for services (MongoDB, backend, frontend)
        run: npx wait-on tcp:localhost:27017 http://127.0.0.1:4000/health http://127.0.0.1:5173 --timeout 60000
      - name: Run E2E tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e --silent
