name: Deploy to EC2 (after ECR push)

on:
  workflow_run:
    workflows: ["Backend Build & Push to ECR"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ECR image
        run: echo 'Image should be available in ECR'

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            echo "Pulling latest image from ECR"
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            echo "Updating project directory"
            cd /opt/smartbuy || mkdir -p /opt/smartbuy && cd /opt/smartbuy
            # Optionally update repo if the code is cloned
            if [ -d .git ]; then
              git fetch --all || true
              git reset --hard origin/main || true
            fi
            echo "Stopping existing container (if any) and running new one via docker-compose"
            if [ -f docker-compose.prod.yml ]; then
              # Replace image tag in compose if necessary
              docker compose -f docker-compose.prod.yml pull || true
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            else
              docker run -d --name smartbuy-backend -p 4000:4000 --env-file .env ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
            fi
            echo "Optional: deploy frontend artifacts if provided"
            # If frontend artifacts are uploaded to /opt/smartbuy/frontend, reload nginx container
            if [ -d ./frontend ] && [ "$(ls -A ./frontend)" ]; then
              echo "Frontend artifacts found, restarting nginx service to pick up static files"
              # If using docker-compose, restarting the compose services will reload volumes
              if systemctl is-active --quiet smartbuy.service; then
                sudo systemctl restart smartbuy.service || true
              else
                docker compose -f docker-compose.prod.yml up -d --remove-orphans || true
              fi
            fi

            echo "Optional: run Certbot to obtain/renew TLS certificates if domain is configured"
            # To enable, ensure /opt/smartbuy/nginx/nginx.conf has server_name configured and sudo is available
            if [ -n "${{ secrets.CERTBOT_DOMAINS }}" ]; then
              DOMAINS=${{ secrets.CERTBOT_DOMAINS }}
              echo "Running certbot for domains: $DOMAINS"
              sudo certbot --nginx -d $DOMAINS --non-interactive --agree-tos -m ${ { secrets.ADMIN_EMAIL }} || true
            fi

            echo "Deployment complete"
